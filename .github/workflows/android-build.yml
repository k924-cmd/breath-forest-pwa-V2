name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      backend:
        description: '后端地址 (IP:端口)，留空用 127.0.0.1:8787'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor deps
        working-directory: android
        run: npm ci

      - name: Build web assets + inject backend host
        working-directory: android
        env:
          BACKEND_HOST: ${{ inputs.backend || '127.0.0.1:8787' }}
        run: node build.js

      - name: Sync Capacitor
        working-directory: android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: breath-forest-android
          path: android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
