<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#d9d1bd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="呼吸森林" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-icon.png" />
    <link rel="icon" href="icons/app-192.png" type="image/png" />
    <link rel="stylesheet" href="styles.css?v=20260808-22" />
    <title>呼吸森林</title>
  </head>
  <body>
    <main id="app" aria-live="polite"><p role="status">正在准备呼吸森林…</p></main>
    <script src="vendor/lottie-web.js"></script>
    <script>
      (() => {
        const APP_VERSION = '20260808-22';
        const CACHE_PREFIX = 'breath-forest-ui-';
        const RECOVERY_PARAM = 'bf-bootstrap';
        const localHosts = ['localhost', '127.0.0.1', '::1'];
        const isLocal = localHosts.includes(location.hostname);
        // API 配置统一在 src/config.js：本地自动回退到 127.0.0.1:8787；
        // 部署时（GitHub Pages / Capacitor）在那里填后端地址与 API Key。

        function showBootstrapError(error) {
          const root = document.querySelector('#app');
          const heading = document.createElement('h1');
          const copy = document.createElement('p');
          heading.textContent = '呼吸森林启动失败';
          copy.textContent = '本地资源恢复未完成，请刷新页面；若问题持续，请关闭该页面后重新打开。';
          root.replaceChildren(heading, copy);
          console.error('Breath Forest bootstrap failed', error);
        }

        async function clearLocalAppCaches() {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames
              .filter(cacheName => cacheName.startsWith(CACHE_PREFIX))
              .map(cacheName => caches.delete(cacheName)));
          }
        }

        window.__BREATH_FOREST_BOOTSTRAP__ = (async () => {
          if (isLocal) {
            const wasControlled = Boolean(navigator.serviceWorker?.controller);
            await clearLocalAppCaches();
            const recoveryUrl = new URL(location.href);
            if (wasControlled && recoveryUrl.searchParams.get(RECOVERY_PARAM) !== APP_VERSION) {
              recoveryUrl.searchParams.set(RECOVERY_PARAM, APP_VERSION);
              location.replace(recoveryUrl.href);
              return;
            }
            if (recoveryUrl.searchParams.has(RECOVERY_PARAM)) {
              recoveryUrl.searchParams.delete(RECOVERY_PARAM);
              history.replaceState(null, '', recoveryUrl.href);
            }
          } else {
            // 手机（非 localhost）：SW 或 HTTP 缓存可能停留在旧版。用 bf-bootstrap
            // 参数做版本标记：若当前 URL 无标记且页面由旧 SW 控制，或 SW 版本与
            // 本版不符，则清掉旧缓存并带版本参数重载，确保拿到新 main.js。
            const recoveryUrl = new URL(location.href);
            const marker = recoveryUrl.searchParams.get(RECOVERY_PARAM);
            const wasControlled = Boolean(navigator.serviceWorker?.controller);
            const cacheIsStale = await (async () => {
              try {
                const keys = await caches.keys();
                return keys.some(key => key.startsWith(CACHE_PREFIX) && !key.includes(APP_VERSION));
              } catch {
                return false;
              }
            })();
            if (wasControlled && marker !== APP_VERSION && cacheIsStale) {
              await clearLocalAppCaches();
              recoveryUrl.searchParams.set(RECOVERY_PARAM, APP_VERSION);
              location.replace(recoveryUrl.href);
              return;
            }
            if (marker === APP_VERSION) {
              recoveryUrl.searchParams.delete(RECOVERY_PARAM);
              history.replaceState(null, '', recoveryUrl.href);
            }
          }
          await import(`./src/main.js?v=${APP_VERSION}`);
        })().catch(showBootstrapError);
      })();
    </script>
  </body>
</html>
